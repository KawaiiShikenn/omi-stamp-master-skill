name: Bug 报告
description: 识别结果不对、程序报错或崩溃
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢报告 Bug！请尽量填全以下信息。
  - type: input
    id: os
    attributes:
      label: 运行环境
      description: 操作系统 + Python 版本
      placeholder: 例：Windows 11 / Python 3.12
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 项目版本
      description: 提交号或版本（`git log -1 --format=%h`）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 怎么触发的？用了什么命令/图片？
      placeholder: |
        1. 运行 `python tools/recognize.py xxx.jpg`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 贴上报错信息 / 识别输出 JSON（注意打码个人敏感信息）
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索 Issues，无重复报告
        - label: 已按 docs/BUILDING.md 构建目录库
