name: 功能建议
description: 新功能、改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢建议！请描述你想要的改进。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 使用场景 + 痛点
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你理想中的功能长什么样
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案（可选）
      description: 你考虑过的替代做法
  - type: input
    id: example
    attributes:
      label: 参考示例（可选）
      description: 其他项目/工具中类似功能的链接或描述
